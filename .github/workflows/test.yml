# Automated test pipeline for Alfred Dev.
#
# Job test: pytest on Python 3.10-3.13. On 3.12 it also runs
# scripts/release_audit.py and coverage (minimum 60%).
# Job plugin: Linux, macOS and Windows. Installs Claude CLI, validates,
# installs 0.8.1 from the checkout (not from GitHub main) and uninstalls.
# FastMCP (requirements.txt) is optional and is not installed here.
#
# Security: no dynamic user input (issue titles, PR bodies, commit
# messages) goes into run: blocks. All commands are static literals.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q --tb=short

      - name: Release audit 0.8.1
        if: matrix.python-version == '3.12'
        run: python3 scripts/release_audit.py

      - name: Run tests with coverage (3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python3 -m pip install --quiet coverage
          coverage run -m pytest tests/ -q --tb=short
          coverage report --fail-under=60
          coverage html -d coverage-html

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14

  plugin:
    name: Claude CLI + plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 0. Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 1. Install Claude CLI (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.claude/local/bin" >> "$GITHUB_PATH"

      - name: 1. Install Claude CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.claude\local\bin"
          if ($env:LOCALAPPDATA) {
            Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\Programs\claude"
          }

      - name: 2. Check Claude CLI
        run: |
          command -v claude
          claude --version

      - name: 3. Validate marketplace
        run: claude plugin validate . --strict

      - name: 4. Validate plugin
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: 5. Register local marketplace
        run: claude plugin marketplace add "${{ github.workspace }}" --scope user

      - name: 6. Install alfred-dev 0.8.1
        run: claude plugin install alfred-dev@alfred-dev --scope user -y

      - name: 7. Show installed inventory
        run: |
          claude plugin list
          claude plugin details alfred-dev@alfred-dev > "$RUNNER_TEMP/alfred-details.txt"
          cat "$RUNNER_TEMP/alfred-details.txt"
          python -c '
          from pathlib import Path
          import os
          text = Path(os.environ["RUNNER_TEMP"], "alfred-details.txt").read_text(encoding="utf-8")
          needed = ("0.8.1", "Skills (11)", "Agents (10)", "MCP servers (1)")
          missing = [item for item in needed if item not in text]
          if missing:
              raise SystemExit("Incomplete inventory: " + ", ".join(missing))
          print("inventory ok:", ", ".join(needed))
          '

      - name: 8. Uninstall (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash uninstall.sh

      - name: 8. Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          foreach ($script in @('install.ps1', 'uninstall.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }
          Write-Host "PowerShell syntax ok: install.ps1 uninstall.ps1"

      - name: 8. Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./uninstall.ps1

      - name: 9. Check that the plugin is gone
        run: |
          python -c '
          import json
          import subprocess
          raw = subprocess.check_output(["claude", "plugin", "list", "--json"], text=True)
          entries = json.loads(raw)
          leftover = [
              item.get("id")
              for item in entries
              if isinstance(item, dict) and "alfred" in str(item.get("id", ""))
          ]
          if leftover:
              raise SystemExit("Still present after uninstall: " + ", ".join(leftover))
          print("uninstall ok: no alfred-dev in claude plugin list")
          '
